version: '3.8'

services:
  web:
    build: .
    container_name: cisco-config-generator
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-jwt-secret}
      - DATABASE_URL=sqlite:////app/instance/config_history.db
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - cisco-net

  # Optional: Redis for rate limiting in production
  # redis:
  #   image: redis:7-alpine
  #   container_name: cisco-redis
  #   restart: unless-stopped
  #   networks:
  #     - cisco-net

networks:
  cisco-net:
    driver: bridge

volumes:
  instance-data:
  logs-data:
  uploads-data:
